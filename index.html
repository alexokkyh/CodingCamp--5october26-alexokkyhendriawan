<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Dashboard</title>

  <!--
    Inline theme guard — MUST run synchronously before the stylesheet is parsed
    to prevent a flash-of-wrong-theme (FOWT).
    Reads localStorage['dashboard-theme'] and applies 'dark' (default) or 'light'
    to document.documentElement.dataset.theme.
    Requirement 5.4, 5.5, 5.6
  -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dashboard-theme');
        document.documentElement.dataset.theme = (t === 'light') ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER — Theme Toggle ===== -->
  <header id="theme-widget" role="banner">
    <h1 class="dashboard-title">Personal Dashboard</h1>
    <button
      id="theme-toggle"
      type="button"
      aria-label="Toggle colour theme"
      title="Toggle light / dark theme"
    >
      <span class="theme-icon" aria-hidden="true">☾</span>
    </button>
  </header>

  <!-- ===== MAIN — Widget Grid ===== -->
  <main id="dashboard-main" role="main">

    <!-- Widget 1: Greeting Clock -->
    <section id="greeting-widget" class="widget" aria-label="Greeting and clock">
      <p id="greeting-text" class="greeting-text" aria-live="polite"></p>
      <p id="time-display"  class="time-display"  aria-live="polite" aria-atomic="true"></p>
      <p id="date-display"  class="date-display"  aria-live="polite"></p>
    </section>

    <!-- Widget 2: Focus Timer -->
    <section id="timer-widget" class="widget" aria-label="Focus timer">
      <h2 class="widget-title">Focus Timer</h2>
      <p id="timer-display" class="timer-display" aria-live="polite" aria-atomic="true">25:00</p>

      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Timer progress"
        aria-valuenow="100"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <div class="timer-controls">
        <button id="timer-start" type="button" aria-label="Start timer">Start</button>
        <button id="timer-stop"  type="button" aria-label="Stop timer">Stop</button>
        <button id="timer-reset" type="button" aria-label="Reset timer">Reset</button>
      </div>
    </section>

    <!-- Widget 3: To-Do List -->
    <section id="todo-widget" class="widget" aria-label="To-do list">
      <h2 class="widget-title">To-Do List</h2>

      <form id="todo-form" class="add-form" aria-label="Add task form" novalidate>
        <label for="todo-input" class="sr-only">New task description</label>
        <input
          id="todo-input"
          type="text"
          placeholder="Add a new task…"
          maxlength="200"
          autocomplete="off"
          aria-label="New task description"
          aria-describedby="todo-error"
        />
        <button type="submit" aria-label="Add task">Add</button>
      </form>
      <p id="todo-error" class="inline-error" role="alert" aria-live="assertive"></p>

      <ul id="task-list" class="task-list" aria-label="Task list"></ul>
    </section>

    <!-- Widget 4: Quick Links -->
    <section id="links-widget" class="widget" aria-label="Quick links">
      <h2 class="widget-title">Quick Links</h2>

      <form id="links-form" class="add-form" aria-label="Add quick link form" novalidate>
        <label for="link-label-input" class="sr-only">Link label</label>
        <input
          id="link-label-input"
          type="text"
          placeholder="Label (max 50 chars)"
          maxlength="50"
          autocomplete="off"
          aria-label="Link label"
          aria-describedby="links-error"
        />
        <label for="link-url-input" class="sr-only">Link URL</label>
        <input
          id="link-url-input"
          type="url"
          placeholder="https://example.com"
          autocomplete="off"
          aria-label="Link URL"
          aria-describedby="links-error"
        />
        <button type="submit" aria-label="Add link">Add</button>
      </form>
      <p id="links-error" class="inline-error" role="alert" aria-live="assertive"></p>

      <div id="links-container" class="links-container" aria-label="Saved links">
        <p id="links-empty" class="empty-state">Add your first link above.</p>
      </div>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
